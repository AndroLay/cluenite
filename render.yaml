services:
  - type: web
    name: cluenite-app
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: npx --yes pnpm@12.16.1 install --frozen-lockfile && npx --yes pnpm@12.16.1 build
    startCommand: npm --prefix apps/server run start
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cluenite-db
          property: connectionString
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_REDIRECT_URI
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OVERLAY_TOKEN_SIGNING_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info

databases:
  - name: cluenite-db
    databaseName: cluenite
    user: cluenite
    plan: 0.1c-256mb
    region: singapore
    ipAllowList: []
