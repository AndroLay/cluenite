name: Backend and production build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cluenite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cluenite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/cluenite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned package manager
        run: npm install --global pnpm@12.16.1 --no-audit --no-fund --silent
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Workspace typecheck
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Engine, auth, realtime, and PostgreSQL tests
        run: pnpm run test --reporter=dot
      - name: Lint errors
        run: pnpm run lint --quiet
