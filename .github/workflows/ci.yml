name: CI and Render deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluenite-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_allowed: ${{ steps.release_window.outputs.allowed }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cluenite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/cluenite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned package manager
        run: npm install --global pnpm@12.16.1 --no-audit --no-fund --silent
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Workspace typecheck
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Engine, auth, realtime, and PostgreSQL tests
        run: pnpm run test --reporter=dot
      - name: Lint errors
        run: pnpm run lint --quiet
      - name: Documentation links
        run: pnpm run docs:check
      - name: Check the hackathon release window
        id: release_window
        run: node scripts/deploy-render.mjs --check-window

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.deployment_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cluenite-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cluenite-app.onrender.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Deploy and verify the exact checked main commit
        run: node scripts/deploy-render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_WORKSPACE_ID }}
